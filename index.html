<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>竹塘志工訪視打卡</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      background-color: #F0F4F8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 96vh;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    .user-pill {
      font-size: 18px;
      font-weight: bold;
      color: #2D3748;
      background: #EDF2F7;
      padding: 8px 18px;
      border-radius: 50px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 19px;
      font-weight: 800;
      color: #2D3748;
      margin: 14px 0;
      line-height: 1.4;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .big-btn {
      width: 100%;
      min-height: 180px;
      border-radius: 20px;
      border: none;
      font-size: 25px;
      font-weight: 900;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.08s, opacity 0.2s;
      margin-bottom: 10px;
    }
    .big-btn:active { transform: scale(0.95); opacity: 0.9; }
    .btn-sub { font-size: 16px; font-weight: normal; margin-top: 8px; opacity: 0.95; }
    
    .btn-in { background-color: #06C755; }
    .btn-out { background-color: #E53E3E; }
    .btn-wait { background-color: #CBD5E0; color: #4A5568; cursor: pointer; }
    .btn-retry { background-color: #4A5568; }

    .case-card-btn {
      width: 100%;
      background: #F7FAFC;
      border: 2px solid #CBD5E0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 800;
      color: #2D3748;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.1s;
    }
    .case-card-btn:active { background: #EDF2F7; border-color: #06C755; transform: scale(0.98); }

    .warning-box {
      background: #FEFCBF;
      color: #744210;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      margin-top: 14px;
      font-weight: bold;
      line-height: 1.4;
    }
    .done-msg {
      font-size: 32px;
      font-weight: 900;
      color: #06C755;
      padding: 35px 10px;
      line-height: 1.5;
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .btn-back {
      background: transparent;
      border: none;
      color: #718096;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div class="user-pill" id="user-display">志工連線中...</div>
    <div class="status-text" id="status-text">🔍 正在搜尋長輩住處...</div>
    <div id="btn-box">
      <button class="big-btn btn-wait" disabled>
        <span>📍 正在取得定位...</span>
        <span class="btn-sub">請稍候 1~2 秒</span>
      </button>
    </div>
    <div id="warning-box"></div>
  </div>

  <script>
    const LIFF_ID = "2011244356-oKiBsEgd";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwuyNTPfdAyZuSqHEeNQkJXEKn0fKHrnZSH9DmdBpjnL0lV-svur0cC4b_UCke_-70x/exec";

    let userProfile = {};
    let currentData = null;
    let selectedCase = null;

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        userProfile = await liff.getProfile();
        document.getElementById("user-display").innerText = `志工：${userProfile.displayName}`;
        fetchLocation();
      } catch (err) {
        showError("LINE 連線失敗，請重新開啟。");
      }
    }

    function fetchLocation() {
      document.getElementById("status-text").innerText = "🔍 正在精準定位中...";
      document.getElementById("btn-box").innerHTML = `
        <button class="big-btn btn-wait" disabled>
          <span>📍 正在取得 GPS...</span>
          <span class="btn-sub">請稍候 1~2 秒</span>
        </button>
      `;
      document.getElementById("warning-box").innerHTML = "";

      if (!navigator.geolocation) {
        showError("手機不支援 GPS 定位");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        queryStatus,
        (error) => {
          showError("請允許手機「定位權限」，才能辨識長輩住處。");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function queryStatus(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "checkStatus",
            userId: userProfile.userId,
            lat: lat,
            lng: lng
          })
        });
        currentData = await response.json();
        currentData.lat = lat;
        currentData.lng = lng;
        renderUI();
      } catch (e) {
        showError("網路訊號較弱，請重試。");
      }
    }

    function renderUI() {
      const btnBox = document.getElementById("btn-box");
      const statusText = document.getElementById("status-text");
      const warningBox = document.getElementById("warning-box");

      if (currentData.status === "error") {
        showError(currentData.message);
        return;
      }

      // 1. 已簽到未簽退（鎖定簽退）
      if (currentData.activeCheckoutCase) {
        selectedCase = { name: currentData.activeCheckoutCase, distance: 0 };
        statusText.innerText = `目前在【${currentData.activeCheckoutCase}】家訪視`;
        btnBox.innerHTML = `
          <button class="big-btn btn-out" onclick="submitPunch('簽退')">
            <span>🚪 準備離開</span>
            <span style="font-size: 32px; margin: 4px 0;">【${currentData.activeCheckoutCase}】家</span>
            <span class="btn-sub">👉 點此完成【簽退】</span>
          </button>
        `;
        warningBox.innerHTML = "";
        return;
      }

      const matched = currentData.matchedCases || [];

      // 2. 只有 1 位長輩在 200m 內
      if (matched.length === 1) {
        selectedCase = matched[0];
        statusText.innerText = `已到達【${selectedCase.name}】家附近`;
        btnBox.innerHTML = `
          <button class="big-btn btn-in" onclick="submitPunch('簽到')">
            <span>📍 我已到達</span>
            <span style="font-size: 32px; margin: 4px 0;">【${selectedCase.name}】家</span>
            <span class="btn-sub">👉 點此完成【簽到】</span>
          </button>
        `;
        warningBox.innerHTML = "";
        return;
      }

      // 3. 2 位以上長輩在 200m 內
      if (matched.length > 1) {
        statusText.innerText = `🔍 偵測到附近有 ${matched.length} 位長輩：`;
        let listHtml = "";
        matched.forEach((c, idx) => {
          listHtml += `
            <div class="case-card-btn" onclick="selectCase(${idx})">
              <span>🏠 <b>${c.name}</b></span>
              <span style="font-size: 15px; color: #06C755;">距離約 ${c.distance}m 👉</span>
            </div>
          `;
        });
        btnBox.innerHTML = listHtml;
        warningBox.innerHTML = `<div class="warning-box">請點選您本次要訪視的長輩進行簽到。</div>`;
        return;
      }

      // 4. 不在長輩範圍內
      statusText.innerText = `⚠️ 尚未到達長輩家範圍`;
      btnBox.innerHTML = `
        <button class="big-btn btn-wait" onclick="fetchLocation()">
          <span>距離最近：【${currentData.nearestCase || '個案'}】</span>
          <span class="btn-sub">尚差約 ${currentData.nearestDistance || '--'} 公尺 (點此重整)</span>
        </button>
      `;
      warningBox.innerHTML = `<div class="warning-box">請抵達長輩住家門口（200 公尺內）再點擊。</div>`;
    }

    function selectCase(index) {
      selectedCase = currentData.matchedCases[index];
      const statusText = document.getElementById("status-text");
      const btnBox = document.getElementById("btn-box");

      statusText.innerText = `已選取【${selectedCase.name}】家`;
      btnBox.innerHTML = `
        <button class="big-btn btn-in" onclick="submitPunch('簽到')">
          <span>📍 我已到達</span>
          <span style="font-size: 32px; margin: 4px 0;">【${selectedCase.name}】家</span>
          <span class="btn-sub">👉 點此完成【簽到】</span>
        </button>
        <button class="btn-back" onclick="renderUI()">↩️ 重選其他長輩</button>
      `;
      document.getElementById("warning-box").innerHTML = "";
    }

    // 零延遲樂觀更新
    function submitPunch(punchType) {
      if (navigator.vibrate) navigator.vibrate(60);

      const targetCaseName = selectedCase.name;

      // 1. 視覺零延遲：瞬間切換成功畫面
      document.getElementById("main-card").innerHTML = `
        <div class="done-msg">
          ✅ ${punchType}成功！<br>
          <span style="font-size: 22px; color: #2D3748;">已完成【${targetCaseName}】${punchType}</span>
          <div style="font-size: 14px; color: #718096; margin-top: 15px;">視窗即將自動關閉...</div>
        </div>
      `;

      // 2. 背景非同步送出資料（不阻礙畫面）
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "punch",
          userId: userProfile.userId,
          userName: userProfile.displayName,
          caseName: targetCaseName,
          punchType: punchType,
          distance: selectedCase.distance || 0,
          lat: currentData.lat,
          lng: currentData.lng
        })
      }).catch(err => {
        console.error("背景存檔錯誤:", err);
      });

      // 3. 2 秒後關閉視窗
      setTimeout(() => {
        try { liff.closeWindow(); } catch(e) {}
      }, 2000);
    }

    function showError(msg) {
      document.getElementById("status-text").innerText = msg;
      document.getElementById("btn-box").innerHTML = `
        <button class="big-btn btn-retry" onclick="location.reload()">🔄 點此重新整理</button>
      `;
      document.getElementById("warning-box").innerHTML = "";
    }

    init();
  </script>
</body>
</html>
